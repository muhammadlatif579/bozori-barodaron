<!DOCTYPE html><html><body style="font-family:sans-serif;text-align:center;padding:20px">
<h2>🔥 Генератори НАВ - мисли пештара, аммо беҳтар!</h2>
<p id="s" style="font-size:18px;font-weight:bold">Сар кардан-ро пахш кун...</p>
<button id="btn" onclick="start()" style="padding:15px 30px;background:#7c3aed;color:#fff;border:none;border-radius:15px;font-size:18px;font-weight:bold">▶️ Сар кардан</button>
<div id="box"></div>
<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
window.start = async function(){
  document.getElementById('btn').style.display='none';
  document.getElementById('s').innerText = '⏳ Молҳо бор карда истодаанд...';
  let r = await fetch('https://raw.githubusercontent.com/muhammadlatif579/bozori-barodaron/main/products_1.json?t='+Date.now());
  let list = await r.json();
  document.getElementById('s').innerText = '✅ '+list.length+' мол ёфт шуд! Модел бор мешавад...';
  let ex = await pipeline('image-feature-extraction','Xenova/clip-vit-base-patch32');
  // ИСЛОҲИ КАЛОН: Куҳнаро умуман намегирем! Ҳамааш аз нав!
  // Пештар: агар куҳна буд - нав намесохт, барои ҳамин 300x300 мемонд!
  let out = {};
  let cnt = 0;
  for(let i=0;i<list.length;i++){
    let p = list[i];
    document.getElementById('s').innerText = '⏳ '+(i+1)+' / '+list.length+' - '+p.name;
    // ИСЛОҲ: Дигар skip намекунем! Ҳар як молро аз нав мехонем!
    try{
      let imgUrl = (p.imgs && p.imgs[0]) ? p.imgs[0] : p.img;
      if(!imgUrl) continue;
      let o = await ex(imgUrl);
      let emb = Array.from(o.data);
      out[p.id] = emb;
      if(p.imgCode) out[p.imgCode] = emb;
      cnt++;
    }catch(e){ console.log('Хатогӣ:', p.name, e); }
  }
  let blob = new Blob([JSON.stringify(out)], {type:'application/json'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download='embeddings.json';
  a.innerText='⬇️ СКАЧАТЬ embeddings.json - '+cnt+' мол тайёр!';
  a.style.cssText='display:block;margin:20px;padding:15px;background:#22c55e;color:#fff;border-radius:15px;font-weight:bold;font-size:18px;text-decoration:none';
  document.getElementById('box').appendChild(a);
  document.getElementById('s').innerText = '🎉 ТАЙЁР! '+cnt+' мол! Скачать-ро пахш кун ва дар GitHub embeddings-и куҳнаро бо наваш иваз кун!';
}
</script></body></html>
