<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Генератор</title></head>
<body style="font-family:sans-serif;padding:20px;text-align:center">
<h2>Генератори Эмбеддинг</h2>
<p id="status">Бор мешавад...</p>
<button onclick="start()" style="background:#7c3aed;color:#fff;border:none;padding:12px 25px;border-radius:20px;font-weight:bold;font-size:16px">▶️ Сар кардан</button>
<br><br><a id="dl" style="display:none;background:green;color:#fff;padding:12px 25px;border-radius:20px;text-decoration:none;font-weight:bold">⬇️ embeddings.json-ро гирифтан</a>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
<script>
let products=[];
async function loadProducts(){
  try{
    let r=await fetch('products_1.json');
    products=await r.json();
    document.getElementById('status').innerText='✅ '+products.length+' мол ёфт шуд. Тугмаи «Сар кардан»-ро пахш кун.';
  }catch(e){ document.getElementById('status').innerText='Хатогӣ: '+e.message; }
}
function cropCenter(imgEl){
  let c=document.createElement('canvas'); let w=imgEl.naturalWidth||imgEl.width,h=imgEl.naturalHeight||imgEl.height;
  let cw=w*0.6,ch=h*0.6,cx=w*0.2,cy=h*0.2; c.width=160;c.height=160;
  let ctx=c.getContext('2d'); ctx.drawImage(imgEl,cx,cy,cw,ch,0,0,160,160); return c;
}
function getColorHist(canvasEl){
  let ctx=canvasEl.getContext('2d'); let d=ctx.getImageData(0,0,160,160).data; let hist=new Array(12).fill(0);
  for(let i=0;i<d.length;i+=16){let r=d[i],g=d[i+1],b=d[i+2];let idx=5; if(r<70&&g<70&&b<70)idx=0; else if(r>180&&g>180&&b>180)idx=1; else if(r>120&&g>80&&b<60)idx=2; else if(r>150&&g<100&&b<100)idx=3; else if(Math.abs(r-g)<20&&Math.abs(g-b)<20)idx=4; hist[idx]++;}
  let s=hist.reduce((a,b)=>a+b,0); return hist.map(x=>x/s);
}
async function start(){
  if(products.length==0){ alert('Молҳо ҳанӯз бор нашудаанд!'); return; }
  document.getElementById('status').innerText='Модел бор мешавад...';
  let model=await mobilenet.load();
  let out={};
  for(let pi=0; pi<products.length; pi++){
    let p=products[pi];
    document.getElementById('status').innerText='Ҳисоб: '+(pi+1)+'/'+products.length+' - '+p.name;
    for(let src of (p.imgs||[]).slice(0,4)){
      try{
        let im=new Image(); im.crossOrigin='anonymous'; im.src=src;
        await new Promise(res=>{im.onload=res; im.onerror=res; setTimeout(res,1500);});
        if(!im.complete||im.naturalWidth==0) continue;
        let cropped=cropCenter(im);
        let t=tf.browser.fromPixels(cropped); let resized=tf.image.resizeBilinear(t,[224,224]);
        let emb=model.infer(resized,true); let arr=Array.from(await emb.data());
        t.dispose(); resized.dispose(); emb.dispose();
        out[src]={e:arr.map(x=>Math.round(x*1000)/1000), h:getColorHist(cropped).map(x=>Math.round(x*1000)/1000)};
      }catch(e){}
    }
    await new Promise(r=>setTimeout(r,10));
  }
  let blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  let a=document.getElementById('dl'); a.href=URL.createObjectURL(blob); a.download='embeddings.json'; a.style.display='inline-block';
  document.getElementById('status').innerText='✅ Тайёр шуд! '+Object.keys(out).length+' акс. Тугмаи сабзро пахш кун.';
}
loadProducts();
</script></body></html>
