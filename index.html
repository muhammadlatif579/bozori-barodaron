<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бозори Бародарон - КУРБОНИЁН</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4B1D8F">
<style>body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:10px}h1{text-align:center;color:#4B1D8F}.card{background:white;padding:15px;margin:10px 0;border-radius:15px;text-align:center;box-shadow:0 2px 8px #ccc}.card img{width:100%;border-radius:10px}.price{font-size:20px;font-weight:bold;color:green}.btn{background:#25D366;color:white;padding:12px;display:block;border-radius:10px;text-decoration:none;margin-top:10px;font-weight:bold}.lang{padding:8px 15px;margin:5px;border-radius:20px;border:1px solid #4B1D8F;background:white}.lang.active{background:#4B1D8F;color:white}</style>
</head>
<body>

<div style="text-align:center">
<button id="b1" class="lang active" onclick="L('tj')">Тоҷикӣ</button>
<button id="b2" class="lang" onclick="L('ru')">Русский</button>
</div>

<h1 id="t">Маҷмуи молу маҳсулотҳо</h1>
<p style="text-align:center">Бозори Бародарон - КУРБОНИЁН</p>

<div id="mahsulotlar"></div>

<script>
function L(x){
  document.getElementById('b1').className='lang'+(x=='tj'?' active':'');
  document.getElementById('b2').className='lang'+(x=='ru'?' active':'');
  document.getElementById('t').innerText = x=='tj' ? 'Маҷмуи молу маҳсулотҳо' : 'Все товары';
  show();
}

function show(){
  let data = JSON.parse(localStorage.getItem('mahsulotlar')) || [];
  let joy = document.getElementById('mahsulotlar');
  joy.innerHTML = "";
  if(data.length==0){
    joy.innerHTML = "<p style='text-align:center'>Ҳозир мол нест. Дар админка мол илова кунед.</p>";
    return;
  }
  data.forEach(m=>{
    let nom = m.nom || m.name || "";
    let tavsif = m.tavsif || m.desc || "";
    let narx = m.narx || m.price || "";
    let rasm = m.rasm || m.image || m.img || "";
    joy.innerHTML += `<div class="card"><img src="${rasm}"><h1>${nom}</h1><p>${tavsif}</p><div class="price">Нарх: ${narx} сомонӣ</div><a class="btn" href="https://wa.me/992930900000?text=Салом, ${nom} -ро мехоҳам">WhatsApp - Фармоиш</a></div>`;
  });
}
L('tj');
</script>
</body>
</html>
