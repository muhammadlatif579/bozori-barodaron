<!DOCTYPE html><html lang="tg"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бозори Бародарон</title><meta name="theme-color" content="#7c3aed"><link rel="manifest" href="manifest.json"><style>body{margin:0;font-family:sans-serif;background:#f5f5f5}header{background:#7c3aed;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold}input,select{width:90%;padding:12px;margin:5px 5%;border-radius:10px;border:1px solid #ddd}select{width:95%}.cats{display:flex;gap:8px;overflow:auto;padding:0 10px}.cats button{padding:8px 15px;border-radius:20px;border:1px solid #ddd;background:#fff;white-space:nowrap}.cats button.on{background:#7c3aed;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:12px;padding:10px;text-align:center;position:relative}.card img{width:100%;height:180px;object-fit:contain;background:#fff;border-radius:8px}.card h3{margin:5px 0;font-size:14px}.price{color:#7c3aed;font-weight:bold}.card button.buy{width:100%;padding:8px;background:#facc15;border:none;border-radius:8px;font-weight:bold;margin-top:5px}.heart{position:absolute;top:12px;right:12px;background:#fff;border:none;font-size:22px;border-radius:50%;width:36px;height:36px;z-index:2}.badge{position:absolute;top:12px;left:12px;background:#000;color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;z-index:2}#cartBtn{position:fixed;bottom:15px;right:15px;background:#facc15;padding:12px 18px;border-radius:25px;font-weight:bold;border:none;z-index:10}#favBtn{position:fixed;bottom:15px;left:15px;background:#fff;padding:12px 15px;border-radius:25px;font-weight:bold;border:1px solid #ddd;z-index:10}#modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:99;color:#fff}#modal img{width:90%;max-height:60vh;object-fit:contain;border-radius:12px}#modal button{padding:10px 18px;border-radius:20px;border:none;font-weight:bold;margin:5px}#adminModal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:100;color:#000;overflow:auto}#adminBox{background:#fff;margin:20px;padding:15px;border-radius:12px}#adminBox input,#adminBox select{width:94%;margin:5px 0}#adminBox button{padding:10px 15px;border-radius:10px;border:none;font-weight:bold;margin:3px}.delBtn{background:#fee;color:#c00;padding:5px 10px!important}.thumb{width:70px;height:70px;object-fit:cover;border-radius:8px;margin:3px;border:2px solid #7c3aed}#sync{text-align:center;font-size:12px;padding:4px;color:#22c55e}#copyBox{width:94%;height:120px;font-size:11px}</style></head><body>
<header id="secretHeader"><img src="logo.png" style="width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid white;vertical-align:middle;margin-right:8px;"><span id="siteName">Бозори Бародарон</span><div style="margin-top:8px"><button onclick="setLang('tg');event.stopPropagation()" id="btnTg" style="padding:6px 12px;border-radius:15px;border:none;font-weight:bold;background:#facc15">🇹🇯 ТОҶИКӢ</button> <button onclick="setLang('ru');event.stopPropagation()" id="btnRu" style="padding:6px 12px;border-radius:15px;border:none;font-weight:bold;background:#fff">🇷🇺 РУССКИЙ</button></div></header>
<div id="sync">✅ Молҳо аз GitHub меоянд - барои ҳама як хел!</div>
<input id="search" placeholder="Ҷустуҷӯ... соат, красовка" oninput="currentPage=1;render()">
<div class="cats" id="cats"></div>
<div style="padding:0 10px;font-weight:bold"><span id="txtProducts">Молҳо</span> <span style="float:right" id="txtDelivery">Душанбе • Доставка</span></div>
<div class="grid" id="list"></div>
<div id="pagination" style="text-align:center;padding:20px 20px 80px"></div>
<button id="favBtn" onclick="showFav()"><span id="txtFav">❤️ Дӯстдоштаҳо</span> (<span id="favCnt">0</span>)</button>
<button id="cartBtn" onclick="order()"><span id="txtCart">🛒 Сабад</span> (<span id="cnt">0</span>) <span id="txtOrder">- Заказ додан</span></button>
<div id="modal"><img id="mImg"><div id="mName" style="font-weight:bold;margin:10px"></div><div><button onclick="prevImg()">◀️ <span id="txtPrev">Пеш</span></button><span id="mCount"></span><button onclick="nextImg()"><span id="txtNext">Баъд</span> ▶️</button></div><div style="display:flex;gap:8px;margin-top:10px"><button onclick="addFromModal()" style="background:#facc15" id="txtAddModal">Ба сабад</button><button onclick="closeModal()" style="background:#fff" id="txtClose">✕ Пӯшидан</button></div></div>
<div id="adminModal"><div id="adminBox"><h3>⚙️ Панели Админ</h3><div id="adminLogin"><p>Рамзро ворид кун:</p><input id="passInput" type="password" placeholder="Рамз"><br><button onclick="checkPass()" style="background:#7c3aed;color:#fff;width:100%">Ворид шудан</button><button onclick="closeAdmin()" style="background:#eee;width:100%">Пӯшидан</button></div><div id="adminPanel" style="display:none">
<div style="background:#fff3cd;padding:12px;border-radius:12px;margin-bottom:10px;border:1px solid #facc15"><b>🔑 Калиди GitHub:</b><br><small>Фақат 1 бор гузор - дигар намепурсад! Ба касе надиҳ!</small><input id="gh_token" type="password" placeholder="ghp_... - ро дар ин ҷо гузор" style="width:94%"><button onclick="saveToken()" style="background:#111;color:#fff;width:100%">Сахра кардани калид</button><p id="tokenStatus" style="font-size:12px;margin:5px 0 0"></p></div>
<button onclick="migrateOld()" style="background:#ff6600;color:#fff;width:100%;padding:12px!important;font-size:15px">🔥 САБУК КУН - Молҳои кӯҳнаро ба 3000 мол табдил деҳ! - 1 бор пахш кун!</button>
<p><b>➕ Моли нав - то 3000 мол!</b></p><input id="aName" placeholder="Номи мол - масалан Кофтаи занона"><input id="aPrice" type="number" placeholder="Нархи нав: масалан 85"><input id="aOldPrice" type="number" placeholder="Нархи кӯҳна: масалан 120 (агар фоиз надорад - холӣ гузор)"><select id="aCat"><option value="mardona">Мардона</option><option value="zanona">Занона</option><option value="kudakona">Кудакона</option><option value="lavozimot">Лавозимоти хона</option></select><p style="font-size:13px"><b>📸 Расм (то 4-то - якҷоя интихоб кун!):</b></p><input id="aFiles" type="file" accept="image/*" multiple onchange="previewImgs(this)"><div id="previewBox" style="display:flex;flex-wrap:wrap"></div><button id="addBtn" onclick="addProduct()" style="background:#22c55e;color:#fff;width:100%">➕ Илова кардан!</button><p id="saveStatus" style="text-align:center;font-weight:bold;font-size:13px"></p><hr><p><b>📋 Молҳои ҳозира:</b></p><div id="adminList"></div><hr><p><b>📤 Захира:</b></p><button onclick="showGitHubCode()" style="background:#000;color:#fff;width:100%">📋 Коди products.json-ро гирифтан</button><textarea id="copyBox" style="display:none" readonly></textarea><button id="copyBtn" onclick="copyCode()" style="background:#facc15;width:100%;display:none">📋 Копия кардан</button><button onclick="closeAdmin()" style="background:#eee;width:100%">✕ Пӯшидан</button></div></div></div>
<script>
let LANG=localStorage.getItem('lang')||'tg';
let T={tg:{all:"Ҳама",mardona:"Мардона",zanona:"Занона",kudakona:"Кудакона",lavozimot:"Лавозимоти хона",search:"Ҷустуҷӯ... соат, красовка, тифал",products:"Молҳо",delivery:"Душанбе • Доставка",add:"Ба сабад",fav:"❤️ Дӯстдоштаҳо",cart:"🛒 Сабад",order:"- Заказ додан",name:"Бозори Бародарон",prev:"Пеш",next:"Баъд",close:"✕ Пӯшидан"},ru:{all:"Все",mardona:"Мужское",zanona:"Женское",kudakona:"Детское",lavozimot:"Товары для дома",search:"Поиск... часы, кроссовки, сковорода",products:"Товары",delivery:"Душанбе • Доставка",add:"В корзину",fav:"❤️ Избранное",cart:"🛒 Корзина",order:"- Заказать",name:"Базари Братьев",prev:"Назад",next:"Далее",close:"✕ Закрыть"}};
function setLang(l){LANG=l;localStorage.setItem('lang',l);let d=document;if(d.getElementById("siteName"))d.getElementById("siteName").innerText=T[LANG].name;if(d.getElementById("search"))d.getElementById("search").placeholder=T[LANG].search;if(d.getElementById("txtProducts"))d.getElementById("txtProducts").innerText=T[LANG].products;if(d.getElementById("txtDelivery"))d.getElementById("txtDelivery").innerText=T[LANG].delivery;if(d.getElementById("txtFav"))d.getElementById("txtFav").innerText=T[LANG].fav;if(d.getElementById("txtCart"))d.getElementById("txtCart").innerText=T[LANG].cart;if(d.getElementById("txtOrder"))d.getElementById("txtOrder").innerText=T[LANG].order;if(d.getElementById("txtAddModal"))d.getElementById("txtAddModal").innerText=T[LANG].add;if(d.getElementById("txtPrev"))d.getElementById("txtPrev").innerText=T[LANG].prev;if(d.getElementById("txtNext"))d.getElementById("txtNext").innerText=T[LANG].next;if(d.getElementById("txtClose"))d.getElementById("txtClose").innerText=T[LANG].close;if(d.getElementById("btnTg"))d.getElementById("btnTg").style.background=LANG=='tg'?'#facc15':'#fff';if(d.getElementById("btnRu"))d.getElementById("btnRu").style.background=LANG=='ru'?'#facc15':'#fff';renderCats();render();}
let ADMIN_PASS="01022008";
let REPO="muhammadlatif579/bozori-barodaron";
let ghToken=localStorage.getItem('gh_token')||'';
let defaultProducts=[{name:"Соати мардона",price:55,cat:"mardona",imgs:["IMG-20261025-WA0010.jpg"]},{name:"Красовкаи мардона",price:75,cat:"mardona",imgs:["IMG-20261031-WA0007.jpg"]},{name:"Красовкаи занона",price:75,cat:"zanona",imgs:["IMG-20261104-WA0097.jpg"]},{name:"Красовкаи кудакона",price:69,cat:"kudakona",imgs:["https://i.ibb.co/Y4bk1wNp/rasm.jpg"]},{name:"Кофтаи занона",price:80,cat:"zanona",imgs:["IMG-20261108-WA0000.jpg"]},{name:"Тифал",price:120,cat:"lavozimot",imgs:["https://images.unsplash.com/photo-1590794056226-79ef3a8147e1?w=400"]},{name:"Каструл",price:95,cat:"lavozimot",imgs:["https://images.unsplash.com/photo-1584990347449-a2d4c2c6d4e4?w=400"]},{name:"Чойник",price:85,cat:"lavozimot",imgs:["https://images.unsplash.com/photo-1594213114663-d94db9b17125?w=400"]},{name:"Табақ",price:45,cat:"lavozimot",imgs:["https://images.unsplash.com/photo-1603199506016-b9a594b593c0?w=400"]}];
let products=[...defaultProducts];
let cats=[["hama","all"],["mardona","mardona"],["zanona","zanona"],["kudakona","kudakona"],["lavozimot","lavozimot"]];
let cur="hama";
let cart = JSON.parse(localStorage.getItem('bb_cart') || '[]');
let favs = JSON.parse(localStorage.getItem('bb_favs') || '[]');
let curProd=null; let curIdx=0; let tempImgs=[]; let tempFiles=[];
let currentPage=1; let perPage=3000;
function renderCats(){document.getElementById("cats").innerHTML=cats.map(c=>`<button class="${cur==c[0]?'on':''}" onclick="setCat('${c[0]}')">${T[LANG][c[1]]}</button>`).join("");}
function setCat(c){cur=c;currentPage=1;renderCats();render();}
function toggleFav(n,e){if(e)e.stopPropagation();if(favs.includes(n)){favs=favs.filter(x=>x!==n);}else{favs.push(n);}localStorage.setItem('bb_favs', JSON.stringify(favs));document.getElementById("favCnt").innerText=favs.length;render();}
function showFav(){if(favs.length==0){alert(LANG=='ru'?"Пока избранное пусто!":"Ҳоло дӯстдоштаҳо холӣ аст!");return;}let list=products.filter(p=>favs.includes(p.name));document.getElementById("list").innerHTML=list.map(p=>cardHtml(p)).join("");document.getElementById("pagination").innerHTML="";}
function cardHtml(p){let disc=p.oldPrice&&p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;return `<div class="card">${disc?`<span class="badge" style="background:#ef4444">-${disc}% 🔥</span>`:`<span class="badge">📸 ${p.imgs.length} акс</span>`}<button class="heart" onclick="toggleFav('${p.name}',event)">${favs.includes(p.name)?'❤️':'🤍'}</button><img src="${p.imgs[0]}" onclick="openModal('${p.name}')"><h3 onclick="openModal('${p.name}')">${p.name}</h3><div class="price">${p.price} с. ${p.oldPrice&&p.oldPrice>p.price?`<s style="color:#999;font-size:12px;font-weight:normal"> ${p.oldPrice} с.</s>`:''}</div><button class="buy" onclick="add('${p.name}')">${T[LANG].add}</button></div>`}
function render(){let q=document.getElementById("search").value.toLowerCase();let filtered=products.filter(p=>(cur=="hama"||p.cat==cur)&&(!q||p.name.toLowerCase().includes(q)));let totalPages=Math.ceil(filtered.length/perPage)||1;if(currentPage>totalPages)currentPage=totalPages;let start=(currentPage-1)*perPage;let pageItems=filtered.slice(start,start+perPage);document.getElementById("list").innerHTML=pageItems.map(p=>cardHtml(p)).join("");let pag="";if(totalPages>1){if(currentPage>1)pag+=`<button onclick="goPage(${currentPage-1})" style="padding:8px 12px;margin:3px;background:#fff;border:1px solid #ddd;border-radius:8px">◀️</button>`;for(let i=1;i<=totalPages;i++){if(i==1||i==totalPages||Math.abs(i-currentPage)<=2){pag+=`<button onclick="goPage(${i})" style="padding:8px 12px;margin:3px;background:${i==currentPage?'#7c3aed':'#fff'};color:${i==currentPage?'#fff':'#000'};border:1px solid #ddd;border-radius:8px">${i}</button>`;}else if(i==currentPage-3||i==currentPage+3){pag+=`<span>...</span>`;}}if(currentPage<totalPages)pag+=`<button onclick="goPage(${currentPage+1})" style="padding:8px 12px;margin:3px;background:#fff;border:1px solid #ddd;border-radius:8px">▶️</button>`;}document.getElementById("pagination").innerHTML=pag+`<div style="font-size:12px;color:#666;margin-top:8px">Ҳамагӣ: ${filtered.length} мол • Саҳифа ${currentPage} аз ${totalPages}</div>`;}
function goPage(p){currentPage=p;render();window.scrollTo(0,0);}
function openModal(name){curProd=products.find(p=>p.name==name);curIdx=0;updateModal();document.getElementById("modal").style.display="flex";}
function updateModal(){document.getElementById("mImg").src=curProd.imgs[curIdx];document.getElementById("mName").innerText=curProd.name+" - "+curProd.price+" с."+(curProd.oldPrice&&curProd.oldPrice>curProd.price?" (Кӯҳна: "+curProd.oldPrice+" с.)":"");document.getElementById("mCount").innerText=" "+(curIdx+1)+" / "+curProd.imgs.length+" ";}
function nextImg(){curIdx=(curIdx+1)%curProd.imgs.length;updateModal();}
function prevImg(){curIdx=(curIdx-1+curProd.imgs.length)%curProd.imgs.length;updateModal();}
function closeModal(){document.getElementById("modal").style.display="none";}
function addFromModal(){add(curProd.name);}
function add(n){cart.push(n);localStorage.setItem('bb_cart', JSON.stringify(cart));document.getElementById("cnt").innerText=cart.length;alert(n+(LANG=='ru'?" в корзину!":" ба сабад рафт!"));}
function order(){if(cart.length==0){alert(LANG=='ru'?"Корзина пуста!":"Сабад холӣ аст!");return;}let txt="Салом! Ман мехоҳам фармоиш диҳам:%0A"+cart.join("%0A");window.open("https://wa.me/992930990895?text="+txt);cart=[];localStorage.setItem('bb_cart','[]');document.getElementById("cnt").innerText="0";}
document.getElementById("mImg").onclick=nextImg;
function openAdmin(){document.getElementById("adminModal").style.display="block";document.getElementById("adminLogin").style.display="block";document.getElementById("adminPanel").style.display="none";}
function closeAdmin(){document.getElementById("adminModal").style.display="none";}
function checkPass(){if(document.getElementById("passInput").value==ADMIN_PASS){document.getElementById("adminLogin").style.display="none";document.getElementById("adminPanel").style.display="block";document.getElementById("gh_token").value=ghToken;updateTokenStatus();renderAdminList();}else{alert("Рамз нодуруст!");}}
function renderAdminList(){document.getElementById("adminList").innerHTML=products.map((p,i)=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:5px 0;align-items:center">${p.name} - ${p.price} с. ${p.oldPrice?` <s style="color:#999">${p.oldPrice}</s>`:''} <span><button onclick="editProduct(${i})" style="background:#facc15;padding:5px 10px;border-radius:10px;border:none;font-weight:bold">✏️ Тағйир</button> <button class="delBtn" onclick="delProduct(${i})">🗑️ Нест кардан</button></span></div>`).join("")+`<div style="text-align:center;padding:10px;font-weight:bold">Ҳамагӣ: ${products.length} мол / 3000</div>`;}
function previewImgs(input){tempImgs=[];tempFiles=[...input.files].slice(0,4);document.getElementById("previewBox").innerHTML="";if(input.files.length>4){alert("Фақат 4 акс!");}tempFiles.forEach(f=>{let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement("canvas");let max=400;let w=img.width,h=img.height;if(w>max){h=h*max/w;w=max;}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);let small=c.toDataURL("image/jpeg",0.55);tempImgs.push(small);document.getElementById("previewBox").innerHTML+=`<img src="${small}" class="thumb">`;};img.src=e.target.result;};r.readAsDataURL(f);});}
function saveToken(){ghToken=document.getElementById("gh_token").value.trim();localStorage.setItem("gh_token",ghToken);updateTokenStatus();alert("Сахра шуд! ✅");}
function updateTokenStatus(){let el=document.getElementById("tokenStatus");if(el)el.innerHTML=ghToken?"✅ Калид ҳаст - омода аст!":"❌ Калид нест - гузор!";}
async function uploadImageToGitHub(dataUrl,name){let base64=dataUrl.includes(',')?dataUrl.split(',')[1]:dataUrl;let fileName='images/'+Date.now()+'_'+Math.floor(Math.random()*100000)+'.jpg';let put=await fetch(`https://api.github.com/repos/${REPO}/contents/`+fileName,{method:'PUT',headers:{'Authorization':'token '+ghToken,'Content-Type':'application/json'},body:JSON.stringify({message:'Расм '+name,content:base64})});if(put.ok){return `https://raw.githubusercontent.com/${REPO}/main/`+fileName;}else{return dataUrl;}}
async function saveToGitHub(){if(!ghToken){alert("Аввал Калиди GitHub-ро гузор!");return false;}document.getElementById("saveStatus").innerText="⏳ Сахра... "+products.length+" мол";try{let chunkSize=500;let chunks=Math.ceil(products.length/chunkSize)||1;for(let i=0;i<chunks;i++){let part=products.slice(i*chunkSize,(i+1)*chunkSize).map(p=>({name:p.name,price:p.price,oldPrice:p.oldPrice||null,cat:p.cat,imgs:p.imgs,img:p.imgs[0]}));let fileName='products_'+(i+1)+'.json';let sha=null;try{let r=await fetch(`https://api.github.com/repos/${REPO}/contents/`+fileName,{headers:{'Authorization':'token '+ghToken}});if(r.ok){let d=await r.json();sha=d.sha;}}catch(e){}let content=btoa(unescape(encodeURIComponent(JSON.stringify(part))));let body={message:'Молҳо '+(i+1)+' - '+products.length,content:content};if(sha)body.sha=sha;await fetch(`https://api.github.com/repos/${REPO}/contents/`+fileName,{method:'PUT',headers:{'Authorization':'token '+ghToken,'Content-Type':'application/json'},body:JSON.stringify(body)});}let idxContent=btoa(unescape(encodeURIComponent(JSON.stringify({total:products.length,chunks:chunks}))));let idxSha=null;try{let r=await fetch(`https://api.github.com/repos/${REPO}/contents/products_index.json`,{headers:{'Authorization':'token '+ghToken}});if(r.ok){idxSha=(await r.json()).sha;}}catch(e){}let idxBody={message:'Индекс',content:idxContent};if(idxSha)idxBody.sha=idxSha;await fetch(`https://api.github.com/repos/${REPO}/contents/products_index.json`,{method:'PUT',headers:{'Authorization':'token '+ghToken,'Content-Type':'application/json'},body:JSON.stringify(idxBody)});document.getElementById("saveStatus").innerText="✅ ШУД! "+products.length+" мол сахра шуд!";return true;}catch(e){document.getElementById("saveStatus").innerText="❌ Хатогӣ!";return false;}}
async function migrateOld(){if(!ghToken){alert("Аввал Калид!");return;}if(!confirm("Молҳои кӯҳна сабук шаванд? 2-3 дақиқа интизор шав - набаро!"))return;document.getElementById("saveStatus").innerText="⏳ Молҳои кӯҳна сабук карда истодаанд... интизор шав!";let changed=0;for(let p of products){let newImgs=[];for(let img of p.imgs){if(img&&img.length>1000&&img.startsWith("data:")){let url=await uploadImageToGitHub(img,p.name);newImgs.push(url);changed++;}else if(img&&img.length>500&&!img.startsWith("http")&&!img.startsWith("IMG-")&&!img.startsWith("https")){try{let url=await uploadImageToGitHub("data:image/jpeg;base64,"+img,p.name);newImgs.push(url);changed++;}catch(e){newImgs.push(img);}}else{newImgs.push(img);}}p.imgs=newImgs;}document.getElementById("saveStatus").innerText="✅ "+changed+" расм сабук шуд! Ҳозир сахра...";await saveToGitHub();alert("ТАМОМ! Ҳозир файл сабук шуд! Баъд аз ин - мол гум намешавад!");}
async function addProduct(){let name=document.getElementById("aName").value.trim();let price=document.getElementById("aPrice").value;let oldPrice=document.getElementById("aOldPrice").value;let cat=document.getElementById("aCat").value;if(!name||!price){alert("Ном ва нархро нависон!");return;}if(tempImgs.length==0){alert("Расмро интихоб кун!");return;}document.getElementById("saveStatus").innerText="⏳ Расмҳо ба GitHub бор карда истодаанд...";let finalImgs=[];for(let i=0;i<tempImgs.length;i++){let img=tempImgs[i];if(img.startsWith("http")||img.startsWith("IMG-")){finalImgs.push(img);}else{let url=await uploadImageToGitHub(img,name);finalImgs.push(url);}}products.push({name:name,price:Number(price),oldPrice:oldPrice?Number(oldPrice):null,cat:cat,imgs:finalImgs});render();renderAdminList();document.getElementById("aName").value="";document.getElementById("aPrice").value="";document.getElementById("aOldPrice").value="";document.getElementById("aFiles").value="";document.getElementById("previewBox").innerHTML="";tempImgs=[];tempFiles=[];await saveToGitHub();}
function editProduct(i){let p=products[i];document.getElementById("aName").value=p.name;document.getElementById("aPrice").value=p.price;document.getElementById("aOldPrice").value=p.oldPrice||"";document.getElementById("aCat").value=p.cat;tempImgs=[...p.imgs];document.getElementById("previewBox").innerHTML=tempImgs.map(s=>`<img src="${s}" class="thumb">`).join("");products.splice(i,1);render();renderAdminList();window.scrollTo(0,0);alert("Хозир боло - ному нархро иваз кун - ва Илова кардан-ро пахш кун!");}
async function delProduct(i){if(!confirm("Нест кунам?"))return;products.splice(i,1);render();renderAdminList();await saveToGitHub();}
function showGitHubCode(){let code=JSON.stringify(products.map(p=>({name:p.name,price:p.price,oldPrice:p.oldPrice||null,cat:p.cat,imgs:p.imgs,img:p.imgs[0]})),null,2);document.getElementById("copyBox").style.display="block";document.getElementById("copyBtn").style.display="block";document.getElementById("copyBox").value=code;alert("Код тайёр шуд!");}
function copyCode(){let t=document.getElementById("copyBox");t.select();document.execCommand("copy");alert("Копия шуд! ✅");}
let tapCount=0; let lastTap=0;
document.getElementById("secretHeader").addEventListener("click", function(e){if(e.target.closest('button'))return;let now=Date.now();if(now-lastTap>2000){tapCount=0;}lastTap=now;tapCount++;if(tapCount>=5){tapCount=0;openAdmin();}});
async function loadAllProducts(){try{let idxRes=await fetch('https://raw.githubusercontent.com/'+REPO+'/main/products_index.json?t='+Date.now());if(idxRes.ok){let idx=await idxRes.json();let all=[];for(let i=1;i<=idx.chunks;i++){let r=await fetch('https://raw.githubusercontent.com/'+REPO+'/main/products_'+i+'.json?t='+Date.now());let part=await r.json();all=all.concat(part);}if(all.length>0){products=all.map(p=>({name:p.name,price:p.price,oldPrice:p.oldPrice||null,cat:p.cat,imgs:p.imgs?p.imgs:[p.img]}));document.getElementById("sync").innerText="✅ "+products.length+" мол аз GitHub омад - барои ҳама як хел!";render();return;}}}catch(e){}try{let r=await fetch('https://raw.githubusercontent.com/'+REPO+'/main/products.json?t='+Date.now());let data=await r.json();if(Array.isArray(data)&&data.length>0){products=data.map(p=>({name:p.name,price:p.price,oldPrice:p.oldPrice||null,cat:p.cat,imgs:p.imgs?p.imgs:[p.img]}));document.getElementById("sync").innerText="✅ "+products.length+" мол аз GitHub омад - барои ҳама як хел!";render();}}catch(e){document.getElementById("sync").innerText="⚠️ Интернет нест - молҳои кӯҳна нишон дода мешаванд";}}
document.getElementById("cnt").innerText = cart.length;
document.getElementById("favCnt").innerText = favs.length;
loadAllProducts();
renderCats();render();setLang(LANG);
</script></body></html>
