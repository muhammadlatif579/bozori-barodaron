<!DOCTYPE html><html lang="tg"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бозори Бародарон</title><meta name="theme-color" content="#7c3aed"><style>body{margin:0;font-family:sans-serif;background:#f5f5f5}header{background:#7c3aed;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold}input,select{width:90%;padding:12px;margin:5px 5%;border-radius:10px;border:1px solid #ddd}select{width:95%}.cats{display:flex;gap:8px;overflow:auto;padding:0 10px}.cats button{padding:8px 15px;border-radius:20px;border:1px solid #ddd;background:#fff;white-space:nowrap}.cats button.on{background:#7c3aed;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:12px;padding:10px;text-align:center;position:relative}.card img{width:100%;height:180px;object-fit:cover;border-radius:8px}.card h3{margin:5px 0;font-size:14px}.price{color:#7c3aed;font-weight:bold}.card button.buy{width:100%;padding:8px;background:#facc15;border:none;border-radius:8px;font-weight:bold;margin-top:5px}.heart{position:absolute;top:12px;right:12px;background:#fff;border:none;font-size:22px;border-radius:50%;width:36px;height:36px;z-index:2}.badge{position:absolute;top:12px;left:12px;background:#000;color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;z-index:2}#cartBtn{position:fixed;bottom:15px;right:15px;background:#facc15;padding:12px 18px;border-radius:25px;font-weight:bold;border:none;z-index:10}#favBtn{position:fixed;bottom:15px;left:15px;background:#fff;padding:12px 15px;border-radius:25px;font-weight:bold;border:1px solid #ddd;z-index:10}#modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:99;color:#fff}#modal img{width:90%;max-height:60vh;object-fit:contain;border-radius:12px}#modal button{padding:10px 18px;border-radius:20px;border:none;font-weight:bold;margin:5px}#adminModal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:100;color:#000;overflow:auto}#adminBox{background:#fff;margin:20px;padding:15px;border-radius:12px}#adminBox input,#adminBox select{width:94%;margin:5px 0}#adminBox button{padding:10px 15px;border-radius:10px;border:none;font-weight:bold;margin:3px}.delBtn{background:#fee;color:#c00;padding:5px 10px!important}.thumb{width:70px;height:70px;object-fit:cover;border-radius:8px;margin:3px;border:2px solid #7c3aed}#sync{text-align:center;font-size:12px;padding:4px;color:#22c55e}#copyBox{width:94%;height:120px;font-size:11px}</style></head><body>
<header id="secretHeader"><img src="IMG-20261105-WA8805.jpg" style="width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid white;vertical-align:middle;margin-right:8px;">Бозори Бародарон</header>
<div id="sync">✅ Молҳо аз GitHub меоянд - барои ҳама як хел!</div>
<input id="search" placeholder="Ҷустуҷӯ... соат, красовка" oninput="render()">
<div class="cats" id="cats"></div>
<div style="padding:0 10px;font-weight:bold">Молҳо <span style="float:right">Душанбе • Доставка</span></div>
<div class="grid" id="list"></div>
<button id="favBtn" onclick="showFav()">❤️ Дӯстдоштаҳо (<span id="favCnt">0</span>)</button>
<button id="cartBtn" onclick="order()">🛒 Сабад (<span id="cnt">0</span>) - Заказ додан</button>
<div id="modal"><img id="mImg"><div id="mName" style="font-weight:bold;margin:10px"></div><div><button onclick="prevImg()">◀️ Пеш</button><span id="mCount"></span><button onclick="nextImg()">Баъд ▶️</button></div><div style="display:flex;gap:8px;margin-top:10px"><button onclick="addFromModal()" style="background:#facc15">Ба сабад</button><button onclick="closeModal()" style="background:#fff">✕ Пӯшидан</button></div></div>
<div id="adminModal"><div id="adminBox"><h3>⚙️ Панели Админ</h3><div id="adminLogin"><p>Рамзро ворид кун:</p><input id="passInput" type="password" placeholder="Рамз"><br><button onclick="checkPass()" style="background:#7c3aed;color:#fff;width:100%">Ворид шудан</button><button onclick="closeAdmin()" style="background:#eee;width:100%">Пӯшидан</button></div><div id="adminPanel" style="display:none">
<div style="background:#fff3cd;padding:12px;border-radius:12px;margin-bottom:10px;border:1px solid #facc15">
<b>🔑 Калиди GitHub:</b><br><small>Фақат 1 бор гузор - дигар намепурсад! Ба касе надиҳ!</small>
<input id="gh_token" type="password" placeholder="ghp_... - ро дар ин ҷо гузор" style="width:94%">
<button onclick="saveToken()" style="background:#111;color:#fff;width:100%">Сахра кардани калид</button>
<p id="tokenStatus" style="font-size:12px;margin:5px 0 0"></p>
</div>
<p><b>➕ Моли нав</b></p><input id="aName" placeholder="Номи мол - масалан Кофтаи занона"><input id="aPrice" type="number" placeholder="Нарх: масалан 80"><select id="aCat"><option value="mardona">Мардона</option><option value="zanona">Занона</option><option value="kudakona">Кудакона</option></select><p style="font-size:13px"><b>📸 Расм (то 4-то - якҷоя интихоб кун!):</b></p><input id="aFiles" type="file" accept="image/*" multiple onchange="previewImgs(this)"><div id="previewBox" style="display:flex;flex-wrap:wrap"></div><button id="addBtn" onclick="addProduct()" style="background:#22c55e;color:#fff;width:100%">➕ Илова кардан!</button><p id="saveStatus" style="text-align:center;font-weight:bold;font-size:13px"></p><hr><p><b>📋 Молҳои ҳозира:</b></p><div id="adminList"></div><hr><p><b>📤 Захира:</b></p><button onclick="showGitHubCode()" style="background:#000;color:#fff;width:100%">📋 Коди products.json-ро гирифтан</button><textarea id="copyBox" style="display:none" readonly></textarea><button id="copyBtn" onclick="copyCode()" style="background:#facc15;width:100%;display:none">📋 Копия кардан</button><button onclick="closeAdmin()" style="background:#eee;width:100%">✕ Пӯшидан</button></div></div></div>
<script>
let ADMIN_PASS="01022008";
let REPO="muhammadlatif579/bozori-barodaron";
let ghToken=localStorage.getItem('gh_token')||'';
let defaultProducts=[
{name:"Соати мардона",price:55,cat:"mardona",imgs:["IMG-20261025-WA0010.jpg"]},
{name:"Красовкаи мардона",price:75,cat:"mardona",imgs:["IMG-20261031-WA0007.jpg"]},
{name:"Красовкаи занона",price:75,cat:"zanona",imgs:["IMG-20261104-WA0097.jpg"]},
{name:"Красовкаи кудакона",price:69,cat:"kudakona",imgs:["https://i.ibb.co/Y4bk1wNp/rasm.jpg"]},
{name:"Кофтаи занона",price:80,cat:"zanona",imgs:["IMG-20261108-WA0000.jpg"]},
];
let products=[...defaultProducts];
let cats=[["hama","Ҳама"],["mardona","Мардона"],["zanona","Занона"],["kudakona","Кудакона"]];
let cur="hama"; let cart=[]; let favs=[]; let curProd=null; let curIdx=0; let tempImgs=[];
function saveLocal(){try{localStorage.setItem("bozori_products",JSON.stringify(products));}catch(e){}}
function dedupe(arr){let seen=new Set();return arr.filter(p=>{let k=p.name+"|"+p.price+"|"+p.cat;if(seen.has(k))return false;seen.add(k);return true;});}
function renderCats(){document.getElementById("cats").innerHTML=cats.map(c=>`<button class="${cur==c[0]?'on':''}" onclick="setCat('${c[0]}')">${c[1]}</button>`).join("");}
function setCat(c){cur=c;renderCats();render();}
function toggleFav(n,e){if(e)e.stopPropagation();if(favs.includes(n)){favs=favs.filter(x=>x!==n);}else{favs.push(n);}document.getElementById("favCnt").innerText=favs.length;render();}
function showFav(){if(favs.length==0){alert("Ҳоло дӯстдоштаҳо холӣ аст!");return;}let list=products.filter(p=>favs.includes(p.name));document.getElementById("list").innerHTML=list.map(p=>cardHtml(p)).join("");}
function cardHtml(p){return `<div class="card"><span class="badge">📸 ${p.imgs.length} акс</span><button class="heart" onclick="toggleFav('${p.name}',event)">${favs.includes(p.name)?'❤️':'🤍'}</button><img src="${p.imgs[0]}" onclick="openModal('${p.name}')"><h3 onclick="openModal('${p.name}')">${p.name}</h3><div class="price">${p.price} с.</div><button class="buy" onclick="add('${p.name}')">Ба сабад</button></div>`}
function render(){let q=document.getElementById("search").value.toLowerCase();let list=products.filter(p=>(cur=="hama"||p.cat==cur)&&(!q||p.name.toLowerCase().includes(q)));document.getElementById("list").innerHTML=list.map(p=>cardHtml(p)).join("");}
function openModal(name){curProd=products.find(p=>p.name==name);curIdx=0;updateModal();document.getElementById("modal").style.display="flex";}
function updateModal(){document.getElementById("mImg").src=curProd.imgs[curIdx];document.getElementById("mName").innerText=curProd.name+" - "+curProd.price+" с.";document.getElementById("mCount").innerText=" "+(curIdx+1)+" / "+curProd.imgs.length+" ";}
function nextImg(){curIdx=(curIdx+1)%curProd.imgs.length;updateModal();}
function prevImg(){curIdx=(curIdx-1+curProd.imgs.length)%curProd.imgs.length;updateModal();}
function closeModal(){document.getElementById("modal").style.display="none";}
function addFromModal(){add(curProd.name);}
function add(n){cart.push(n);document.getElementById("cnt").innerText=cart.length;alert(n+" ба сабад рафт!");}
function order(){if(cart.length==0){alert("Сабад холӣ аст!");return;}let txt="Салом! Ман мехоҳам фармоиш диҳам:%0A"+cart.join("%0A");window.open("https://wa.me/992930990895?text="+txt);}
document.getElementById("mImg").onclick=nextImg;
function openAdmin(){document.getElementById("adminModal").style.display="block";document.getElementById("adminLogin").style.display="block";document.getElementById("adminPanel").style.display="none";}
function closeAdmin(){document.getElementById("adminModal").style.display="none";}
function checkPass(){if(document.getElementById("passInput").value==ADMIN_PASS){document.getElementById("adminLogin").style.display="none";document.getElementById("adminPanel").style.display="block";document.getElementById("gh_token").value=ghToken;updateTokenStatus();renderAdminList();}else{alert("Рамз нодуруст!");}}
function renderAdminList(){document.getElementById("adminList").innerHTML=products.map((p,i)=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:5px 0;align-items:center">${p.name} - ${p.price} с. <span><button onclick="editProduct(${i})" style="background:#facc15;padding:5px 10px;border-radius:10px;border:none;font-weight:bold">✏️ Тағйир</button> <button class="delBtn" onclick="delProduct(${i})">🗑️ Нест кардан</button></span></div>`).join("");}function previewImgs(input){tempImgs=[];document.getElementById("previewBox").innerHTML="";let files=[...input.files].slice(0,4);if(input.files.length>4){alert("Фақат 4 акс! Аввалин 4-то гирифта шуд!");}files.forEach(f=>{let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement("canvas");let max=650;let w=img.width,h=img.height;if(w>max){h=h*max/w;w=max;}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);let small=c.toDataURL("image/jpeg",0.75);tempImgs.push(small);document.getElementById("previewBox").innerHTML+=`<img src="${small}" class="thumb">`;};img.src=e.target.result;};r.readAsDataURL(f);});}
function saveToken(){ghToken=document.getElementById("gh_token").value.trim();localStorage.setItem("gh_token",ghToken);updateTokenStatus();alert("Сахра шуд! ✅");}
function updateTokenStatus(){let el=document.getElementById("tokenStatus");if(el)el.innerHTML=ghToken?"✅ Калид ҳаст - омода аст!":"❌ Калид нест - гузор!";}
async function saveToGitHub(){
 if(!ghToken){alert("Аввал Калиди GitHub-ро гузор!");return false;}
 document.getElementById("saveStatus").innerText="⏳ Дар GitHub навишта истодааст...";
 try{
  let res=await fetch(`https://api.github.com/repos/${REPO}/contents/products.json`,{headers:{'Authorization':'token '+ghToken}});
  let data=await res.json();
  let toSave=products.map(p=>({name:p.name,price:p.price,cat:p.cat,imgs:p.imgs,img:p.imgs[0]}));
  let content=btoa(unescape(encodeURIComponent(JSON.stringify(toSave,null,2))));
  let put=await fetch(`https://api.github.com/repos/${REPO}/contents/products.json`,{method:'PUT',headers:{'Authorization':'token '+ghToken,'Content-Type':'application/json'},body:JSON.stringify({message:'Моли нав - Бозори Бародарон',content:content,sha:data.sha})});
  if(put.ok){document.getElementById("saveStatus").innerText="✅ ШУД! Ҳама ҳозир мебинанд!";return true;}
  else{document.getElementById("saveStatus").innerText="❌ Хатогӣ - калидро санҷ!";return false;}
 }catch(e){document.getElementById("saveStatus").innerText="❌ Интернет нест!";return false;}
}
async function addProduct(){
 let name=document.getElementById("aName").value.trim();
 let price=document.getElementById("aPrice").value;
 let cat=document.getElementById("aCat").value;
 if(!name||!price){alert("Ном ва нархро нависон!");return;}
 if(tempImgs.length==0){alert("Расмро интихоб кун!");return;}
 products.push({name:name,price:Number(price),cat:cat,imgs:[...tempImgs]});
 render();renderAdminList();
 document.getElementById("aName").value="";document.getElementById("aPrice").value="";document.getElementById("aFiles").value="";document.getElementById("previewBox").innerHTML="";tempImgs=[];
 await saveToGitHub();
}
function editProduct(i){
let p=products[i];
document.getElementById("aName").value=p.name;
document.getElementById("aPrice").value=p.price;
document.getElementById("aCat").value=p.cat;
tempImgs=[...p.imgs];
document.getElementById("previewBox").innerHTML=tempImgs.map(s=>`<img src="${s}" class="thumb">`).join("");
products.splice(i,1);
render();
renderAdminList();
window.scrollTo(0,0);
alert("Хозир боло - ному нархро иваз кун - ва Илова кардан-ро пахш кун!");
  }
  async function delProduct(i){if(!confirm("Нест кунам?"))return;products.splice(i,1);render();renderAdminList();await saveToGitHub();}
function showGitHubCode(){let code=JSON.stringify(products.map(p=>({name:p.name,price:p.price,cat:p.cat,imgs:p.imgs,img:p.imgs[0]})),null,2);document.getElementById("copyBox").style.display="block";document.getElementById("copyBtn").style.display="block";document.getElementById("copyBox").value=code;alert("Код тайёр шуд!");}
function copyCode(){let t=document.getElementById("copyBox");t.select();document.execCommand("copy");alert("Копия шуд! ✅");}
let tapCount=0; let lastTap=0;
document.getElementById("secretHeader").addEventListener("click", function(){let now=Date.now();if(now-lastTap>2000){tapCount=0;}lastTap=now;tapCount++;if(tapCount>=5){tapCount=0;openAdmin();}});
fetch('https://raw.githubusercontent.com/muhammadlatif579/bozori-barodaron/main/products.json?t='+Date.now())
  .then(r=>r.json())
  .then(data=>{
    if(Array.isArray(data)&&data.length>0){
      products=data.map(p=>({name:p.name,price:p.price,cat:p.cat,imgs:p.imgs?p.imgs:[p.img]}));
      document.getElementById("sync").innerText="✅ "+products.length+" мол аз GitHub омад - барои ҳама як хел!";
      render();
    }
  }).catch(e=>{document.getElementById("sync").innerText="⚠️ Интернет нест - молҳои кӯҳна нишон дода мешаванд";});
renderCats();render();
</script></body></html>
