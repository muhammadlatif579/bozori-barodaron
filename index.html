<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бозори Бародарон</title>
<style>
body{font-family:Arial;margin:0;background:#f2f2f2}
header{background:#6a0dad;color:white;padding:12px;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px;text-align:center}
.search-box{display:flex;gap:5px;margin-top:10px}
.search-box input{flex:1;padding:10px;border-radius:10px;border:none}
.search-box button{padding:10px 15px;border:none;border-radius:10px;background:#ffcc00;font-weight:bold}
.cats{display:flex;gap:6px;overflow:auto;padding:10px;background:white}
.cats button{white-space:nowrap;padding:8px 14px;border:1px solid #ddd;border-radius:20px;background:#fff;cursor:pointer}
.cats button.active{background:#6a0dad;color:white}
.top-bar{display:flex;justify-content:space-between;padding:10px 15px;font-weight:bold}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;border-radius:12px;overflow:hidden;position:relative}
.card img{width:100%;height:160px;object-fit:cover}
.card-body{padding:8px}
.card-body h3{margin:0;font-size:14px}
.price{color:#6a0dad;font-weight:bold;margin:5px 0}
.fav{position:absolute;top:8px;right:8px;background:white;border-radius:50%;width:32px;height:32px;border:none;font-size:18px;cursor:pointer}
.fav.on{color:red}
.add{width:100%;padding:8px;background:#6a0dad;color:white;border:none;border-radius:8px;cursor:pointer}
#cartBtn{position:fixed;bottom:15px;right:15px;background:#ffcc00;padding:14px 20px;border-radius:30px;border:none;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,0.3);z-index:20}
#cartModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:30}
.modal-box{background:white;margin:30px 15px;padding:15px;border-radius:15px;max-height:80vh;overflow:auto}
</style>
</head>
<body>

<header>
<h1>🛍️ Бозори Бародарон</h1>
<div class="search-box">
<input id="search" placeholder="Ҷустуҷӯ... курта, соат, сумка" oninput="filter()">
<button onclick="showFav()">❤️ <span id="favCount">0</span></button>
</div>
</header>

<div class="cats">
<button class="active" onclick="setCat('hama',this)">Ҳама</button>
<button onclick="setCat('mardona',this)">Мардона</button>
<button onclick="setCat('zanona',this)">Занона</button>
<button onclick="setCat('kudakona',this)">Кӯдакона</button>
<button onclick="setCat('ruzmarra',this)">Рӯзмарра</button>
<button onclick="setCat('fav',this)">❤️ Дӯстдошта</button>
</div>

<div class="top-bar"><span id="count">Молҳо</span><span>Душанбе • Доставка</span></div>

<div class="products" id="list"></div>

<button id="cartBtn" onclick="openCart()">🛒 Сабад (<span id="cartCount">0</span>)</button>

<div id="cartModal"><div class="modal-box">
<h3>Сабади шумо</h3>
<div id="cartItems"></div>
<h3 id="total"></h3>
<button onclick="order()" style="width:100%;padding:12px;background:#25D366;color:white;border:none;border-radius:10px;font-weight:bold">Фармоиш дар WhatsApp</button>
<button onclick="closeCart()" style="width:100%;padding:10px;margin-top:8px">Пӯшидан</button>
</div></div>

<script>
let products=[
{name:"Куртаи чармӣ мардона",price:350,cat:"mardona",img:"https://picsum.photos/300/200?random=1",desc:"Дарунаш пашмин"},
{name:"Соати мардона",price:55,cat:"mardona",img:"https://picsum.photos/300/200?random=2",desc:"Қаҳваранг / Сиёҳ"},
{name:"Сумкаи занона",price:120,cat:"zanona",img:"https://picsum.photos/300/200?random=3",desc:"Муд"},
{name:"Куртаи кӯдакона",price:90,cat:"kudakona",img:"https://picsum.photos/300/200?random=4",desc:"Гарм"},
{name:"Красовкаи занона",price:75,cat:"zanona",img:"https://picsum.photos/300/200?random=5",desc:"36-40"},

];
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
let favs=JSON.parse(localStorage.getItem('favs')||'[]');
let currentCat='hama';

function render(){
let q=document.getElementById('search').value.toLowerCase();
let list=document.getElementById('list'); list.innerHTML='';
let filtered=products.filter(p=>{
if(currentCat=='fav') return favs.includes(p.name);
if(currentCat!='hama' && p.cat!=currentCat) return false;
if(q && !p.name.toLowerCase().includes(q)) return false;
return true;
});
document.getElementById('count').innerText=filtered.length+" мол ёфт шуд";
filtered.forEach(p=>{
let isFav=favs.includes(p.name)?'on':'';
list.innerHTML+=`<div class="card">
<button class="fav ${isFav}" onclick="toggleFav('${p.name}')">❤️</button>
<img src="${p.img}" onerror="this.src='https://via.placeholder.com/300x200?text=Бозори+Бародарон'">
<div class="card-body"><h3>${p.name}</h3><div>${p.desc}</div><div class="price">${p.price} сомонӣ</div>
<button class="add" onclick="addToCart('${p.name}')">Ба сабад +</button></div></div>`;
});
updateCounts();
}
function setCat(c,el){currentCat=c;document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}
