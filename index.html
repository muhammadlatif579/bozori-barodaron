<!DOCTYPE html><html lang="tg"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бозори Бародарон</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7c3aed"><style>body{margin:0;font-family:sans-serif;background:#f5f5f5}header{background:#7c3aed;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold}input,select{width:90%;padding:12px;margin:5px 5%;border-radius:10px;border:1px solid #ddd}select{width:95%}.cats{display:flex;gap:8px;overflow:auto;padding:0 10px}.cats button{padding:8px 15px;border-radius:20px;border:1px solid #ddd;background:#fff;white-space:nowrap}.cats button.on{background:#7c3aed;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:12px;padding:10px;text-align:center;position:relative}.card img{width:100%;height:170px;object-fit:contain;background:#fff;border-radius:8px}.card h3{margin:5px 0;font-size:14px}.price{color:#7c3aed;font-weight:bold}.card button.buy{width:100%;padding:8px;background:#facc15;border:none;border-radius:8px;font-weight:bold;margin-top:5px}.heart{position:absolute;top:12px;right:12px;background:#fff;border:none;font-size:22px;border-radius:50%;width:36px;height:36px;z-index:2}.badge{position:absolute;top:12px;left:12px;background:#000;color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;z-index:2}#cartBtn{position:fixed;bottom:15px;right:15px;background:#facc15;padding:12px 18px;border-radius:25px;font-weight:bold;border:none;z-index:10}#favBtn{position:fixed;bottom:15px;left:15px;background:#fff;padding:12px 15px;border-radius:25px;font-weight:bold;border:1px solid #ddd;z-index:10}#modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:99;color:#fff}#modal img{width:90%;max-height:60vh;object-fit:contain;border-radius:12px}#modal button{padding:10px 18px;border-radius:20px;border:none;font-weight:bold;margin:5px}#adminModal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:100;color:#000;overflow:auto}#adminBox{background:#fff;margin:20px;padding:15px;border-radius:12px}#adminBox input,#adminBox select{width:94%;margin:5px 0}#adminBox button{padding:10px 15px;border-radius:10px;border:none;font-weight:bold;margin:3px}.delBtn{background:#fee;color:#c00;padding:5px 10px!important}</style></head><body>
<header id="secretHeader"><img src="IMG-20261105-WA8805.jpg" style="width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid white;vertical-align:middle;margin-right:8px;">Бозори Бародарон</header>
<input id="search" placeholder="Ҷустуҷӯ... соат, красовка" oninput="render()">
<div class="cats" id="cats"></div>
<div style="padding:0 10px;font-weight:bold">Молҳо <span style="float:right">Душанбе • Доставка</span></div>
<div class="grid" id="list"></div>
<button id="favBtn" onclick="showFav()">❤️ Дӯстдоштаҳо (<span id="favCnt">0</span>)</button>
<button id="cartBtn" onclick="order()">🛒 Сабад (<span id="cnt">0</span>) - Заказ додан</button>
<div id="modal"><img id="mImg"><div id="mName" style="font-weight:bold;margin:10px"></div><div><button onclick="prevImg()">◀️ Пеш</button><span id="mCount"></span><button onclick="nextImg()">Баъд ▶️</button></div><div style="display:flex;gap:8px;margin-top:10px"><button onclick="addFromModal()" style="background:#facc15">Ба сабад</button><button onclick="closeModal()" style="background:#fff">✕ Пӯшидан</button></div></div>
<div id="adminModal"><div id="adminBox"><h3>⚙️ Панели Админ</h3><div id="adminLogin"><p>Рамзро ворид кун:</p><input id="passInput" type="password" placeholder="Рамз"><br><button onclick="checkPass()" style="background:#7c3aed;color:#fff;width:100%">Ворид шудан</button><button onclick="closeAdmin()" style="background:#eee;width:100%">Пӯшидан</button></div><div id="adminPanel" style="display:none"><p><b>➕ Моли нав илова кардан</b></p><input id="aName" placeholder="Номи мол: масалан Красовкаи нав"><input id="aPrice" type="number" placeholder="Нарх: масалан 90"><select id="aCat"><option value="mardona">Мардона</option><option value="zanona">Занона</option><option value="kudakona">Кудакона</option></select><input id="aImg" placeholder="Номи расм: масалан IMG-2026....jpg"><div style="font-size:12px;color:#666">1. Расмро аввал дар GitHub бор кун<br>2. Номашро инҷо навишта</div><button onclick="addProduct()" style="background:#22c55e;color:#fff;width:100%">➕ Илова кардан</button><hr><p><b>📋 Молҳои ҳозира:</b></p><div id="adminList"></div><hr><p><b>📤 Барои ҳама нишон додан:</b></p><button onclick="exportCode()" style="background:#facc15;width:100%">📋 Кодро нусхабардорӣ кун</button><div id="exportBox" style="display:none"><textarea id="exportText" style="width:100%;height:120px;margin-top:8px"></textarea><div style="font-size:12px">Ин кодро нусха кун ва дар index.html ба ҷои молҳои кӯҳна гузор!</div></div><button onclick="closeAdmin()" style="background:#eee;width:100%">✕ Пӯшидан</button></div></div></div>
<script>
let ADMIN_PASS = "01022008";
let defaultProducts=[
{name:"Соати мардона",price:55,cat:"mardona",imgs:["IMG-20261025-WA0010.jpg","IMG-20261106-WA9532.jpg","IMG-20261106-WA8372.jpg","IMG-20261106-WA9265.jpg"]},
{name:"Красовкаи мардона",price:75,cat:"mardona",imgs:["IMG-20261031-WA0007.jpg"]},
{name:"Красовкаи занона",price:75,cat:"zanona",imgs:["IMG-20261104-WA0097.jpg"]},
{name:"Красовкаи кудакона",price:69,cat:"kudakona",imgs:["https://i.ibb.co/Y4bk1wNp/rasm.jpg"]},
];
let products = JSON.parse(localStorage.getItem("myProducts")||"null");
if(!products || products.length==0){ products = defaultProducts; localStorage.setItem("myProducts", JSON.stringify(products)); }
let cats=[["hama","Ҳама"],["mardona","Мардона"],["zanona","Занона"],["kudakona","Кудакона"]];
let cur="hama"; let cart=[]; let favs=[]; let curProd=null; let curIdx=0;
function save(){localStorage.setItem("myProducts",JSON.stringify(products));}
function renderCats(){document.getElementById("cats").innerHTML=cats.map(c=>`<button class="${cur==c[0]?'on':''}" onclick="setCat('${c[0]}')">${c[1]}</button>`).join("");}
function setCat(c){cur=c;renderCats();render();}
function toggleFav(n,e){if(e)e.stopPropagation();if(favs.includes(n)){favs=favs.filter(x=>x!==n);}else{favs.push(n);}document.getElementById("favCnt").innerText=favs.length;render();}
function showFav(){if(favs.length==0){alert("Ҳоло дӯстдоштаҳо холӣ аст!");return;}let list=products.filter(p=>favs.includes(p.name));document.getElementById("list").innerHTML=list.map(p=>cardHtml(p)).join("");}
function cardHtml(p){return `<div class="card"><span class="badge">📸 ${p.imgs.length} акс</span><button class="heart" onclick="toggleFav('${p.name}',event)">${favs.includes(p.name)?'❤️':'🤍'}</button><img src="${p.imgs[0]}" onclick="openModal('${p.name}')"><h3 onclick="openModal('${p.name}')">${p.name}</h3><div class="price">${p.price} с.</div><button class="buy" onclick="add('${p.name}')">Ба сабад</button></div>`}
function render(){let q=document.getElementById("search").value.toLowerCase();let list=products.filter(p=>(cur=="hama"||p.cat==cur)&&(!q||p.name.toLowerCase().includes(q)));document.getElementById("list").innerHTML=list.map(p=>cardHtml(p)).join("");}
function openModal(name){curProd=products.find(p=>p.name==name);curIdx=0;updateModal();document.getElementById("modal").style.display="flex";}
function updateModal(){document.getElementById("mImg").src=curProd.imgs[curIdx];document.getElementById("mName").innerText=curProd.name+" - "+curProd.price+" с.";document.getElementById("mCount").innerText=" "+(curIdx+1)+" / "+curProd.imgs.length+" ";}
function nextImg(){curIdx=(curIdx+1)%curProd.imgs.length;updateModal();}
function prevImg(){curIdx=(curIdx-1+curProd.imgs.length)%curProd.imgs.length;updateModal();}
function closeModal(){document.getElementById("modal").style.display="none";}
function addFromModal(){add(curProd.name);}
function add(n){cart.push(n);document.getElementById("cnt").innerText=cart.length;alert(n+" ба сабад рафт!");}
function order(){if(cart.length==0){alert("Сабад холӣ аст!");return;}let txt="Салом! Ман мехоҳам фармоиш диҳам:%0A"+cart.join("%0A");window.open("https://wa.me/992930990895?text="+txt);}
document.getElementById("mImg").onclick=nextImg;
function openAdmin(){document.getElementById("adminModal").style.display="block";document.getElementById("adminLogin").style.display="block";document.getElementById("adminPanel").style.display="none";}
function closeAdmin(){document.getElementById("adminModal").style.display="none";}
function checkPass(){if(document.getElementById("passInput").value==ADMIN_PASS){document.getElementById("adminLogin").style.display="none";document.getElementById("adminPanel").style.display="block";renderAdminList();}else{alert("Рамз нодуруст!");}}
function renderAdminList(){document.getElementById("adminList").innerHTML=products.map((p,i)=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:5px 0">${p.name} - ${p.price} с. <button class="delBtn" onclick="delProduct(${i})">🗑️ Нест кардан</button></div>`).join("");}
function addProduct(){let n=document.getElementById("aName").value.trim();let pr=Number(document.getElementById("aPrice").value);let c=document.getElementById("aCat").value;let im=document.getElementById("aImg").value.trim();if(!n||!pr||!im){alert("Ҳамаашро пур кун! Ном, нарх, номи расм");return;}products.push({name:n,price:pr,cat:c,imgs:[im]});save();render();renderAdminList();alert(n+" илова шуд! ✅");document.getElementById("aName").value="";document.getElementById("aPrice").value="";document.getElementById("aImg").value="";}
function delProduct(i){if(confirm("Нест кунам?")){products.splice(i,1);save();render();renderAdminList();}}
function exportCode(){let code=products.map(p=>`{name:"${p.name}",price:${p.price},cat:"${p.cat}",imgs:["${p.imgs.join('","')}"]}`).join(",\n");document.getElementById("exportBox").style.display="block";document.getElementById("exportText").value=code;document.getElementById("exportText").select();document.execCommand("copy");alert("Код нусха шуд! Ҳозир дар GitHub дар index.html гузор!");}
let tapCount=0; let lastTap=0;
document.getElementById("secretHeader").addEventListener("click", function(){
  let now = Date.now();
  if(now - lastTap > 2000){ tapCount = 0; }
  lastTap = now;
  tapCount++;
  if(tapCount >= 5){ tapCount = 0; openAdmin(); }
});
renderCats();render();
</script></body></html>
