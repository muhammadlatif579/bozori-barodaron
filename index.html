<!DOCTYPE html><html lang="tg"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бозори Бародарон</title><style>body{margin:0;font-family:sans-serif;background:#f5f5f5}header{background:#7c3aed;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold}input{width:90%;padding:12px;margin:10px 5%;border-radius:10px;border:1px solid #ddd}.cats{display:flex;gap:8px;overflow:auto;padding:0 10px}.cats button{padding:8px 15px;border-radius:20px;border:1px solid #ddd;background:#fff;white-space:nowrap}.cats button.on{background:#7c3aed;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:12px;padding:10px;text-align:center}.card img{width:100%;height:170px;object-fit:cover;border-radius:8px}.card h3{margin:5px 0;font-size:14px}.price{color:#7c3aed;font-weight:bold}.card button{width:100%;padding:8px;background:#facc15;border:none;border-radius:8px;font-weight:bold;margin-top:5px}#cartBtn{position:fixed;bottom:15px;right:15px;background:#facc15;padding:12px 18px;border-radius:25px;font-weight:bold;border:none}</style></head><body>
<header>🛍️ Бозори Бародарон</header>
<input id="search" placeholder="Ҷустуҷӯ... соат, красовка" oninput="render()">
<div class="cats" id="cats"></div>
<div style="padding:0 10px;font-weight:bold">Молҳо <span style="float:right">Душанбе • Доставка</span></div>
<div class="grid" id="list"></div>
<button id="cartBtn" onclick="order()">🛒 Сабад (<span id="cnt">0</span>) - Заказ додан</button>
<script>
let products=[
{name:"Соати мардона",price:55,cat:"mardona",img:"IMG-20261025-WA0010.jpg"},
{name:"Красовкаи мардона",price:75,cat:"mardona",img:"IMG-20261031-WA0007.jpg"},
{name:"Красовкаи занона",price:75,cat:"zanona",img:"IMG-20261104-WA0097.jpg"},
];
let cats=[["hama","Ҳама"],["mardona","Мардона"],["zanona","Занона"]];
let cur="hama"; let cart=[];
function renderCats(){document.getElementById("cats").innerHTML=cats.map(c=>`<button class="${cur==c[0]?'on':''}" onclick="setCat('${c[0]}')">${c[1]}</button>`).join("");}
function setCat(c){cur=c;renderCats();render();}
function render(){let q=document.getElementById("search").value.toLowerCase();let list=products.filter(p=>(cur=="hama"||p.cat==cur)&&(!q||p.name.toLowerCase().includes(q)));document.getElementById("list").innerHTML=list.map(p=>`<div class="card"><img src="${p.img}"><h3>${p.name}</h3><div class="price">${p.price} с.</div><button onclick="add('${p.name}')">Ба сабад</button></div>`).join("");}
function add(n){cart.push(n);document.getElementById("cnt").innerText=cart.length;alert(n+" ба сабад рафт!");}
function order(){if(cart.length==0){alert("Сабад холӣ аст!");return;}let txt="Салом! Ман мехоҳам фармоиш диҳам:%0A"+cart.join("%0A");window.open("https://wa.me/992930990895?text="+txt);}
renderCats();render();
</script></body></html>
